id: a03
title: TDD kata - coupon policy
track: a-unit-testing
kind: backend
test_package: dev.orderflow.tracks.a03
requires_stack: false
pass_threshold: 70
weights: { bugs: 50, mutation: 25, practices: 25 }
# Bugs are planted in a reference implementation, swapped in for the
# participant's own CouponPolicy during the bug bank.
implementation_swap:
  path: app/backend/src/main/java/dev/orderflow/domain/coupon/CouponPolicy.java
  reference: bugs/reference/CouponPolicy.java
mutation:
  target_classes: ["dev.orderflow.domain.coupon.CouponPolicy"]
  target_score: 80
practices:
  - { rule: quarkus-test-required, required: true }
  - no-thread-sleep
  - no-disabled-tests
  - every-test-asserts
  - naming-convention
  - random-order-stable
  - rule: tdd-history
    implementation: app/backend/src/main/java/dev/orderflow/domain/coupon/CouponPolicy.java
    min_percent: 60
timeouts: { test_run_seconds: 300 }
