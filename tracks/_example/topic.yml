# Example topic used to develop and check the review engine (phase 2).
# Participants may use it to learn how reviews work; it does not count.
id: example
title: Example - testing the order state machine
track: _example
kind: backend
test_package: dev.orderflow.tracks.example
requires_stack: false
pass_threshold: 70
weights: { bugs: 50, mutation: 25, practices: 25 }
mutation:
  target_classes: ["dev.orderflow.domain.OrderStateMachine"]
  target_score: 80
practices:
  - no-thread-sleep
  - no-disabled-tests
  - every-test-asserts
  - naming-convention
  - random-order-stable
timeouts: { test_run_seconds: 300 }
bug_bank: { min: 3, max: 3 }   # the example keeps it small
