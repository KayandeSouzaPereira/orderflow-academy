id: b07
title: Order lifecycle and concurrency
track: b-integration-testing
kind: api
test_package: dev.orderflow.apitests.tracks.b07
requires_stack: true          # full stack, processor delay 3000 ms
pass_threshold: 70
weights: { bugs: 70, practices: 30 }
