id: bonus
title: Review of tests generated by AI
track: bonus-ai-review
kind: multi
suites:
  - { kind: backend, test_package: dev.orderflow.tracks.bonus }
  - { kind: api, test_package: dev.orderflow.apitests.tracks.bonus }
requires_stack: true
pass_threshold: 70
# Expected score of the untouched starter suite (the "base score" of the session).
calibration: { min: 20, max: 35 }
# 50 bugs + 20 mutation + 20 practices + 10 for the fixed HallucinatedApiTest.
weights: { bugs: 50, mutation: 20, practices: 20 }
bug_bank: { min: 8, max: 8 }
parallel_stacks: 3
mutation:
  target_classes:
    - dev.orderflow.application.CreateOrderUseCase
    - dev.orderflow.application.ProcessOrderCreatedUseCase
    - dev.orderflow.domain.OrderPricing
  target_tests: ["dev.orderflow.tracks.bonus.*"]
  target_score: 75
practices:
  - { rule: original-tests-kept, list: original-tests.txt, required: true }
  - no-thread-sleep
  - no-disabled-tests
  - every-test-asserts
  - naming-convention
  - random-order-stable
  - no-empty-catch
timeouts: { test_run_seconds: 600 }
random_seeds: [1, 2]   # 20261001 and 4242 (the default) put OrderQueryApiTest in a lucky order
