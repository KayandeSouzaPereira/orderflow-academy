# ---------------------------------------------------------------------------
# OrderFlow configuration. Every value can be overridden with an environment
# variable (e.g. orderflow.processor.delay-ms -> ORDERFLOW_PROCESSOR_DELAY_MS).
# ---------------------------------------------------------------------------

quarkus.application.name=orderflow
# All messages in English, whatever the machine locale is.
quarkus.default-locale=en-US
quarkus.locales=en-US
# The AWS stack comes from app/docker-compose.yml (Floci), never from Dev Services.
quarkus.compose.devservices.enabled=false

# --- AWS (Floci) -----------------------------------------------------------
# Endpoint used by the backend to reach AWS. Never hard-code it elsewhere.
orderflow.aws.endpoint=${AWS_ENDPOINT_URL:http://localhost:4566}
orderflow.aws.region=${AWS_REGION:us-east-1}
# Dummy credentials: Floci accepts anything.
orderflow.aws.access-key-id=${AWS_ACCESS_KEY_ID:test}
orderflow.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}
# Endpoint used to build pre-signed URLs handed to browsers. Differs from
# orderflow.aws.endpoint when the backend runs inside Docker.
orderflow.aws.public-endpoint=${orderflow.aws.endpoint}

quarkus.dynamodb.endpoint-override=${orderflow.aws.endpoint}
quarkus.dynamodb.aws.region=${orderflow.aws.region}
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=${orderflow.aws.access-key-id}
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=${orderflow.aws.secret-access-key}
quarkus.dynamodb.devservices.enabled=false

quarkus.sqs.endpoint-override=${orderflow.aws.endpoint}
quarkus.sqs.aws.region=${orderflow.aws.region}
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=${orderflow.aws.access-key-id}
quarkus.sqs.aws.credentials.static-provider.secret-access-key=${orderflow.aws.secret-access-key}
quarkus.sqs.devservices.enabled=false

quarkus.s3.endpoint-override=${orderflow.aws.endpoint}
quarkus.s3.aws.region=${orderflow.aws.region}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${orderflow.aws.access-key-id}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${orderflow.aws.secret-access-key}
quarkus.s3.path-style-access=true
quarkus.s3.devservices.enabled=false

# --- Resource names (configurable so tests can isolate them) ---------------
orderflow.dynamodb.products-table=products
orderflow.dynamodb.orders-table=orders
orderflow.dynamodb.orders-by-customer-index=customerEmail-index
orderflow.sqs.order-created-queue=order-created
orderflow.s3.bucket=orderflow

# Pre-signed URL lifetime.
orderflow.s3.presigned-url-ttl=15M

# --- Order processor -------------------------------------------------------
orderflow.processor.enabled=true
orderflow.processor.poll-interval=1s
# Minimum age of an OrderCreated event before it is processed. Keeps orders
# observable in PENDING for black-box tests (reviews use 3000).
orderflow.processor.delay-ms=0
# How long a received message stays invisible before it can be received again.
orderflow.processor.visibility-timeout-seconds=2

# --- Test-data endpoints (/api/admin/*) ------------------------------------
orderflow.admin.enabled=false

# --- HTTP / OpenAPI --------------------------------------------------------
quarkus.http.port=8080
quarkus.smallrye-openapi.info-title=OrderFlow API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Fictional online store used by OrderFlow Academy.
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# Dev mode: admin endpoints on, so the stack is usable for exploring.
%dev.orderflow.admin.enabled=true

# Tests (@QuarkusTest): no background processor (it would poll whatever runs
# on port 4566), and a random HTTP port so several test runs can share a
# machine. FlociTestResource turns the processor back on for integration tests.
%test.orderflow.processor.enabled=false
%test.quarkus.http.test-port=0
