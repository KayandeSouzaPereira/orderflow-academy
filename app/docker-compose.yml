# OrderFlow local stack.
#
#   docker compose up -d                  # Floci + aws-init (day-to-day: run backend and frontend yourself)
#   docker compose --profile full up -d   # also backend and frontend, as used by reviews of tracks B and C
#
# Environment knobs for the full profile:
#   ORDERFLOW_PROCESSOR_DELAY_MS  (default 0; track B reviews use 3000)
#   ORDERFLOW_ADMIN_ENABLED       (default true here, so black-box tests can prepare data)
#   FLOCI_PORT / BACKEND_PORT / FRONTEND_PORT  host ports (default 4566 / 8080 / 4200);
#                                 reviews use other ports so they never clash with your dev stack
name: orderflow

services:
  floci:
    image: floci/floci:2.1.0
    ports:
      - "${FLOCI_PORT:-4566}:4566"

  aws-init:
    build:
      context: ./aws-init
    depends_on:
      floci:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: "no"

  backend:
    profiles: ["full"]
    build:
      context: ./backend
    depends_on:
      aws-init:
        condition: service_completed_successfully
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      # Pre-signed URLs are opened from the host (browser, tests), not from inside Docker.
      ORDERFLOW_AWS_PUBLIC_ENDPOINT: http://localhost:${FLOCI_PORT:-4566}
      ORDERFLOW_ADMIN_ENABLED: ${ORDERFLOW_ADMIN_ENABLED:-true}
      ORDERFLOW_PROCESSOR_DELAY_MS: ${ORDERFLOW_PROCESSOR_DELAY_MS:-0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/ready >/dev/null || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
